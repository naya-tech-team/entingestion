[project]
name = "entingestion-common"
version = "0.1.0"
description = "Code shared by the producer, ingestion and UI backend services: ARN authorization, page tokens, DynamoDB helpers, SigV4 signing and timestamps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "botocore>=1.35",  # SigV4 signing and ClientError; every service bundles it already
]

[dependency-groups]
dev = [
    "botocore-stubs>=1.35",  # types for mypy --strict
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entcommon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src"]
packages = ["entcommon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
