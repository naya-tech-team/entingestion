[project]
name = "producer"
version = "0.1.0"
description = "Producer service for the article ingestion platform: process registry, presigned uploads, verified article registration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.0,<4",
    "boto3>=1.35",
    "botocore>=1.35",
    "pydantic>=2.9,<3",
    "python-ulid>=3.0,<4",
    "filetype>=1.2,<2",  # MIT: magic-number checks of uploaded files
    "entingestion-common",  # services/common (path source below)
]

[project.optional-dependencies]
# The CLI needs requests; the Lambda zip doesn't (build_lambda.sh installs without extras).
cli = ["requests>=2.32,<3"]

[project.scripts]
producer-cli = "producer_client.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,s3,sqs]>=1.35",
    "moto[dynamodb,s3,sqs]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "requests>=2.32,<3",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/producer", "client/producer_client"]

[tool.uv.sources]
# Shared code (services/common); the Lambda builds install it next to the hash-locked deps.
entingestion-common = { path = "../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "client", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Fixtures import the app after moto and env vars are in place.
"tests/**" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "client"]
packages = ["producer", "producer_client"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "filetype.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "client"]
addopts = "-ra"
